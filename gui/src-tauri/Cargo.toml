[package]
name = "instlux-gui"
version = "0.1.0"
description = "Natív Tauri felület az Instlux (instagram-cli fork) fölé"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }

[[bin]]
name = "instlux-gui"
path = "src/main.rs"
